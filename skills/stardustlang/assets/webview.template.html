<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StardustLang · app</title>
<!--
  skills/stardustlang/assets/webview.template.html — La app generada, funcionando
  dentro del chat de AI Edge Gallery. Recibe el programa en ?p=<base64url> (lo
  construye scripts/index.html tras validarlo) y lo ejecuta en la StardustVM WASM
  con el pintor genérico de web/runtime.js. Los ficheros de FILE persisten en
  IndexedDB por programa.

  Marcadores con doble guion bajo (skills/build-skill.sh): GLUE, RUNTIME, WASM
-->
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel-2:#1b222c; --ink:#e6edf3; --muted:#8b949e;
    --line:#2a313c; --accent:#e0a458; --lcd:#7ee0c8; --lcd-bg:#0a1712; --danger:#f2685f;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#eef1f5; --panel:#ffffff; --panel-2:#f4f6f9; --ink:#1a2029; --muted:#5a6472;
      --line:#dce1e8; --accent:#b5761f; --lcd:#0f7a63; --lcd-bg:#e7f4ee; --danger:#c14338; }
  }
  *{ box-sizing:border-box; }
  html, body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:15px; line-height:1.45; }
  .bar{ display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  .bar .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; }
  .bar .name{ font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar .meta{ margin-left:auto; color:var(--muted); font-size:12px; white-space:nowrap; }
  #app{ padding:14px; }
  .err{ color:var(--danger); white-space:pre-wrap; font-size:13px; padding:14px; }
  details{ border-top:1px solid var(--line); font-size:12px; }
  summary{ padding:8px 14px; color:var(--muted); cursor:pointer; }
  #bus{ padding:0 14px 12px; max-height:180px; overflow:auto; }
  #bus .line{ white-space:pre-wrap; word-break:break-word; padding:1px 0; }
  #bus .line.danger{ color:var(--danger); }
  .code-bar{ display:flex; justify-content:flex-end; padding:0 14px 6px; }
  .code-bar button{ font:inherit; font-size:12px; color:var(--ink); background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer; }
  #code{ margin:0 14px 12px; padding:10px; max-height:260px; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px;
    font-size:11.5px; white-space:pre-wrap; word-break:break-word; user-select:all; }

  .w-col{ display:flex; flex-direction:column; gap:10px; min-width:0; }
  .w-row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .w-grid{ display:grid; gap:8px; }
  .w-list{ display:flex; flex-direction:column; gap:6px; }
  .w-label{ overflow-wrap:anywhere; white-space:pre-wrap; }
  #app > .w-col > .w-label:first-child{ background:var(--lcd-bg); color:var(--lcd); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font-size:20px; font-variant-numeric:tabular-nums; }
  .w-list > .w-label{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .w-button{ font:inherit; color:var(--ink); background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    min-height:44px; padding:8px 12px; cursor:pointer; }
  .w-button:active{ transform:translateY(1px); border-color:var(--accent); }
  .w-input{ display:flex; gap:8px; }
  .w-input input{ flex:1; min-width:0; font:inherit; color:var(--ink); background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px; }
  .w-image{ border:1px solid var(--line); border-radius:10px; background:var(--panel-2); min-height:80px; display:grid; place-items:center; overflow:hidden; }
  .w-image img{ max-width:100%; display:block; }
  .w-image iframe{ width:100%; height:300px; border:0; background:#fff; }
  .w-image pre{ margin:0; padding:10px; width:100%; max-height:300px; overflow:auto; font-size:12px; white-space:pre-wrap; }
  .w-empty{ color:var(--muted); font-style:italic; padding:6px; }
  .w-drop{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:16px; border:1.5px dashed var(--line); border-radius:12px; color:var(--muted); font-size:13px; text-align:center; }
  .w-drop strong{ color:var(--ink); }
  .w-drop.over{ border-color:var(--accent); }
  .w-textarea{ display:flex; flex-direction:column; gap:8px; }
  .w-textarea textarea{ width:100%; min-height:160px; font:inherit; font-size:13px; color:var(--ink); background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px; }
  .w-textarea-bar{ display:flex; justify-content:flex-end; }
  .w-html{ font-family:var(--sans); overflow-wrap:anywhere; }
</style>
</head>
<body>
<div class="bar"><span class="dot"></span><span class="name" id="name">StardustLang</span><span class="meta" id="meta"></span></div>
<main id="app"></main>
<details id="code-panel"><summary>código StardustLang</summary><div class="code-bar"><button id="copy" type="button">Copiar</button></div><pre id="code"></pre></details>
<details><summary>bus de mensajes · <span id="count">0</span></summary><div id="bus"></div></details>

<script type="module">
/*__GLUE__*/

/*__RUNTIME__*/

const $ = (id) => document.getElementById(id);
let n = 0;
function trace(line) {
  const d = document.createElement("div"); d.className = "line"; d.textContent = line;
  if (/FALLO|descartado/.test(line)) d.classList.add("danger");
  $("bus").appendChild(d); $("bus").scrollTop = $("bus").scrollHeight;
  $("count").textContent = String(++n);
}
function fromB64url(s) {
  const b64 = s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4);
  return new TextDecoder().decode(b64ToBytes(b64));
}

try {
  // ?s= trae el texto .stardust (formato principal); ?p=, la IR en JSON.
  const params = new URLSearchParams(location.search);
  const s = params.get("s"), p = params.get("p");
  if (!s && !p) throw new Error("no se recibió ningún programa (?s= o ?p=)");
  await __wbg_init({ module_or_path: b64ToBytes("__WASM__") });
  let source, shown;
  if (s) {
    shown = fromB64url(s);
    const report = JSON.parse(compile_program(shown));
    if (!report.ok) throw new Error(report.errors.map(e => `línea ${e.line}: ${e.message}`).join("\n"));
    source = JSON.stringify(report.ir);
  } else {
    source = fromB64url(p);
    shown = JSON.stringify(JSON.parse(source), null, 2);
  }
  const prog = JSON.parse(source);
  // El modelo no repite el código en el chat (ahorra contexto): está aquí.
  $("code").textContent = shown;
  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("code").textContent); $("copy").textContent = "Copiado"; }
    catch (_) { const r = document.createRange(); r.selectNodeContents($("code")); getSelection().removeAllRanges(); getSelection().addRange(r); $("copy").textContent = "Seleccionado"; }
  });
  $("name").textContent = prog.program || "app";
  $("meta").textContent = (prog.actors || []).length + " actor" + ((prog.actors || []).length === 1 ? "" : "es");
  document.title = (prog.program || "app") + " · StardustLang";

  const disk = openStardustDisk("stardust-skill:" + (prog.program || "app"));
  const rt = createStardustRuntime({ source, rootEl: $("app"), onTrace: trace, mirror: (engine) => disk.mirror(engine) });
  JSON.parse(rt.engine.boot_trace()).forEach(trace);
  (await disk.mount(rt.engine)).forEach(trace);
  await rt.start();
} catch (e) {
  const d = document.createElement("div"); d.className = "err";
  d.textContent = "No se pudo abrir la app: " + (e && e.message ? e.message : e);
  $("app").replaceChildren(d);
}
</script>
</body>
</html>
