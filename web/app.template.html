<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StardustVM · App</title>
<!--
  web/app.template.html — Renderer web GENÉRICO de la StardustVM.

  Pinta cualquier programa StardustLang con `view`: el árbol de widgets llega ya
  resuelto del núcleo Rust (engine.render()) y web/runtime.js lo traduce a DOM.
  Esta página no lleva lógica de negocio: solo el marco (bus, estado, fuente) y
  el disco persistente (VFS del Engine espejado a IndexedDB).

  Marcadores (con doble guion bajo) que sustituye web/build-app.sh:
    PROGRAM      JSON del programa (dentro de un <script type="application/json">)
    GLUE     glue de wasm-bindgen (--target web)
    RUNTIME  web/runtime.js
    WASM         el .wasm en base64 (sin fetch: apto para CSP estricto)
-->
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel-2:#1b222c; --ink:#e6edf3; --muted:#8b949e;
    --line:#2a313c; --accent:#e0a458; --accent-ink:#241704; --lcd:#7ee0c8; --lcd-bg:#0a1712;
    --danger:#f2685f; --ok:#5db98b;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius:14px;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#eef1f5; --panel:#ffffff; --panel-2:#f4f6f9; --ink:#1a2029; --muted:#5a6472;
      --line:#dce1e8; --accent:#b5761f; --accent-ink:#fff6ea; --lcd:#0f7a63; --lcd-bg:#e7f4ee;
      --danger:#c14338; --ok:#2f8a5f;
    }
  }
  :root[data-theme="light"]{
    --bg:#eef1f5; --panel:#ffffff; --panel-2:#f4f6f9; --ink:#1a2029; --muted:#5a6472;
    --line:#dce1e8; --accent:#b5761f; --accent-ink:#fff6ea; --lcd:#0f7a63; --lcd-bg:#e7f4ee;
    --danger:#c14338; --ok:#2f8a5f;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono);
    line-height:1.5; -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 60%);
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:clamp(20px,4vw,44px) clamp(16px,3vw,32px) 56px; }

  header.head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:24px; }
  .eyebrow{ font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); font-weight:600; }
  h1{ font-size:clamp(22px,3.4vw,30px); margin:.3em 0 .2em; letter-spacing:-.01em; font-weight:650; overflow-wrap:anywhere; }
  .sub{ color:var(--muted); font-family:var(--sans); font-size:14px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip{ font-size:11.5px; border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:2px 10px; color:var(--muted); }
  .chip b{ color:var(--ink); font-weight:600; }
  .chip.warn{ color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, var(--line)); }
  .theme-btn{
    flex:none; font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--muted);
    background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:8px 14px; cursor:pointer;
  }
  .theme-btn:hover{ color:var(--ink); border-color:var(--accent); }

  .device{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,400px); gap:20px; align-items:start; }
  @media (max-width:860px){ .device{ grid-template-columns:1fr; } }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); min-width:0; }
  .app{ padding:18px; }
  .err{ color:var(--danger); white-space:pre-wrap; font-size:13px; }

  .tabs{ display:flex; gap:4px; padding:6px; border-bottom:1px solid var(--line); }
  .tab{ font-family:var(--mono); font-size:12px; color:var(--muted); background:transparent; border:0; border-radius:8px; padding:7px 12px; cursor:pointer; }
  .tab[aria-selected="true"]{ color:var(--ink); background:var(--panel-2); }
  .tab:hover{ color:var(--ink); }
  .pane{ padding:14px 16px; height:min(520px,60vh); overflow:auto; font-size:12.5px; }
  .pane[hidden]{ display:none; }
  .pane pre{ margin:0; white-space:pre-wrap; word-break:break-word; }
  .bus .line{ padding:2px 0; white-space:pre-wrap; word-break:break-word; }
  .bus .line .arrow{ color:var(--accent); }
  .bus .line.danger{ color:var(--danger); }
  .bus .empty{ color:var(--muted); font-family:var(--sans); font-style:italic; }
  .actor-block{ margin-bottom:14px; }
  .actor-name{ color:var(--accent); }
  .cap{ color:var(--muted); }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin-top:6px; }
  .kv .k{ color:var(--muted); } .kv .v{ overflow-wrap:anywhere; }
  .foot{ margin-top:22px; color:var(--muted); font-family:var(--sans); font-size:13px; }

  /* ── Widgets (clases que emite web/runtime.js) ─────────────────────────── */
  .w-col{ display:flex; flex-direction:column; gap:10px; min-width:0; }
  .w-row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; min-width:0; }
  .w-grid{ display:grid; gap:10px; }
  .w-list{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .w-label{ overflow-wrap:anywhere; white-space:pre-wrap; }
  .w-col > .w-label:first-child{
    background:var(--lcd-bg); color:var(--lcd); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; font-size:clamp(18px,3vw,26px); font-variant-numeric:tabular-nums;
  }
  .w-button{
    font-family:var(--mono); font-size:15px; color:var(--ink); background:var(--panel-2);
    border:1px solid var(--line); border-radius:10px; padding:10px 14px; min-height:44px; cursor:pointer;
    transition:transform .05s ease, border-color .15s; overflow-wrap:anywhere;
  }
  .w-button:hover{ border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .w-button:active{ transform:translateY(1px); }
  .w-button:focus-visible, .w-input input:focus-visible, .w-textarea textarea:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .w-input{ display:flex; gap:8px; min-width:0; }
  .w-input input{ flex:1; min-width:0; font:inherit; font-size:14px; color:var(--ink); background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .w-image{ border:1px solid var(--line); border-radius:10px; background:var(--panel-2); min-height:120px; display:grid; place-items:center; overflow:hidden; }
  .w-image img{ max-width:100%; max-height:420px; display:block; }
  .w-image iframe{ width:100%; height:420px; border:0; background:#fff; }
  .w-image pre{ margin:0; padding:12px; width:100%; max-height:420px; overflow:auto; font-size:12px; white-space:pre-wrap; }
  .w-empty{ color:var(--muted); font-family:var(--sans); font-style:italic; padding:8px; }
  .w-drop{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:22px; border:1.5px dashed var(--line); border-radius:12px; color:var(--muted); font-family:var(--sans); font-size:13px; cursor:pointer; text-align:center; }
  .w-drop strong{ color:var(--ink); font-family:var(--mono); font-weight:600; }
  .w-drop.over, .w-drop:hover{ border-color:var(--accent); color:var(--ink); }
  .w-textarea{ display:flex; flex-direction:column; gap:8px; }
  .w-textarea textarea{ width:100%; min-height:260px; resize:vertical; font:inherit; font-size:13px; color:var(--ink); background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .w-textarea-bar{ display:flex; justify-content:flex-end; }
  .w-html{ font-family:var(--sans); line-height:1.6; overflow-wrap:anywhere; }
  .w-html code{ font-family:var(--mono); background:var(--panel-2); border:1px solid var(--line); border-radius:5px; padding:0 5px; font-size:.92em; }
  .w-html pre{ background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; }
  .w-html h1, .w-html h2, .w-html h3{ font-family:var(--mono); line-height:1.25; }
  @media (prefers-reduced-motion:reduce){ .w-button:active{ transform:none; } }
</style>
</head>
<body>
<script type="application/json" id="program">
__PROGRAM__
</script>

<div class="wrap">
  <header class="head">
    <div>
      <div class="eyebrow">StardustVM · app</div>
      <h1 id="title">…</h1>
      <div class="sub">Renderer web genérico: la vista llega resuelta desde el núcleo Rust (WASM).</div>
      <div class="chips" id="chips"></div>
    </div>
    <button class="theme-btn" id="theme" type="button">tema</button>
  </header>

  <main class="device">
    <section class="panel app" id="app" aria-label="Vista de la app"></section>

    <section class="panel" aria-label="Observabilidad">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-pane="bus">bus</button>
        <button class="tab" role="tab" aria-selected="false" data-pane="state">estado</button>
        <button class="tab" role="tab" aria-selected="false" data-pane="src">programa</button>
      </div>
      <div class="pane bus" id="bus"><div class="empty">Sin mensajes todavía.</div></div>
      <div class="pane" id="state" hidden></div>
      <div class="pane" id="src" hidden><pre></pre></div>
    </section>
  </main>

  <p class="foot">Cada interacción entra como un mensaje al actor (visible en el bus); los ficheros de la capacidad
    <code>FILE</code> se espejan a IndexedDB y sobreviven a las recargas.</p>
</div>

<script type="module">
/*__GLUE__*/

/*__RUNTIME__*/

// ── Tema ────────────────────────────────────────────────────────────────────
const themeBtn=document.getElementById("theme");
const prefersDark=()=>matchMedia("(prefers-color-scheme: dark)").matches;
function applyTheme(t){ if (t) document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme;
  const dark = t ? t==="dark" : prefersDark(); themeBtn.textContent = dark ? "☾ oscuro" : "☀ claro"; }
let theme=null; try { theme=localStorage.getItem("stardust-theme"); } catch(_){}
applyTheme(theme);
themeBtn.addEventListener("click",()=>{ const dark = theme ? theme==="dark" : prefersDark();
  theme = dark ? "light" : "dark"; try { localStorage.setItem("stardust-theme", theme); } catch(_){} applyTheme(theme); });

// ── Pestañas ────────────────────────────────────────────────────────────────
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", String(x===t)));
  document.querySelectorAll(".pane").forEach(p=>p.hidden = p.id!==t.dataset.pane);
}));

// ── Observabilidad ──────────────────────────────────────────────────────────
const busEl=document.getElementById("bus");
function trace(line){
  if (busEl.querySelector(".empty")) busEl.replaceChildren();
  const d=document.createElement("div"); d.className="line";
  if (/FALLO|denegad|error(?!: null)/i.test(line)) d.classList.add("danger");
  const m=line.match(/^(.*?)( -> )(.*)$/);
  if (m){ d.append(m[1]); const a=document.createElement("span"); a.className="arrow"; a.textContent=m[2]; d.append(a, m[3]); }
  else d.textContent=line;
  busEl.appendChild(d); busEl.scrollTop=busEl.scrollHeight;
}
function fmt(v){ if (typeof v==="string") return JSON.stringify(v); const s=JSON.stringify(v); return s.length>160 ? s.slice(0,157)+"…" : s; }
function showState(engine){
  const st=JSON.parse(engine.state_json()); const frag=document.createDocumentFragment();
  for (const [name, a] of Object.entries(st)){
    const b=document.createElement("div"); b.className="actor-block";
    const h=document.createElement("div");
    h.innerHTML='<span class="actor-name"></span> <span class="cap"></span>';
    h.firstChild.textContent=name; h.lastChild.textContent="["+(a.capabilities||[]).join(", ")+"]";
    const kv=document.createElement("div"); kv.className="kv";
    const keys=Object.keys(a.memory||{}).sort();
    if (!keys.length){ const e=document.createElement("div"); e.className="k"; e.textContent="(memoria vacía)"; kv.appendChild(e); }
    for (const k of keys){ const kk=document.createElement("div"); kk.className="k"; kk.textContent=k;
      const vv=document.createElement("div"); vv.className="v"; vv.textContent=fmt(a.memory[k]); kv.append(kk, vv); }
    b.append(h, kv); frag.appendChild(b);
  }
  document.getElementById("state").replaceChildren(frag);
}

// ── Arranque ────────────────────────────────────────────────────────────────
const source=document.getElementById("program").textContent.trim();
const appEl=document.getElementById("app");
let prog={}; try { prog=JSON.parse(source); } catch(_){}
const name=prog.program || "app";
document.title=name+" · StardustVM";
document.getElementById("title").textContent=name;
document.querySelector("#src pre").textContent=JSON.stringify(prog, null, 2);
const chips=document.getElementById("chips");
for (const a of prog.actors || []){
  const c=document.createElement("span"); c.className="chip";
  c.innerHTML="<b></b> "; c.firstChild.textContent=a.name; c.append((a.capabilities||[]).join(" · ") || "ciego");
  chips.appendChild(c);
}

try {
  await __wbg_init({ module_or_path: b64ToBytes("__WASM__") });
  const disk=openStardustDisk("stardust-app:"+name);
  const rt=createStardustRuntime({
    source, rootEl:appEl, onTrace:trace,
    mirror: async (engine)=>{ await disk.mirror(engine); showState(engine); },
  });
  (await disk.mount(rt.engine)).forEach(trace);
  if (!(await disk.persistent)){
    const c=document.createElement("span"); c.className="chip warn"; c.textContent="sin IndexedDB: no persiste"; chips.appendChild(c);
  }
  showState(rt.engine);
  await rt.start();
} catch (e){
  const d=document.createElement("div"); d.className="err";
  d.textContent="No se pudo cargar el programa:\n"+(e && e.message ? e.message : e);
  appEl.replaceChildren(d);
  console.error(e);
}
</script>
</body>
</html>
